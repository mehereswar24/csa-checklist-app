<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Org EHS Maturity - Comprehensive Safety Audit & Multi-Unit Benchmark</title>
    <!-- Google Fonts: Plus Jakarta Sans, Outfit, Inter, JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,600&display=swap" rel="stylesheet">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['var(--font-primary, "Plus Jakarta Sans")', 'Inter', 'sans-serif'],
              mono: ['"JetBrains Mono"', 'monospace'],
              heading: ['var(--font-heading, "Plus Jakarta Sans")', 'sans-serif']
            }
          }
        }
      }
    </script>
    <style>
      :root {
        --font-primary: 'Plus Jakarta Sans', sans-serif;
        --font-heading: 'Plus Jakarta Sans', sans-serif;
      }
      body {
        font-family: var(--font-primary);
      }
      /* Custom Scrollbars */
      ::-webkit-scrollbar {
        width: 7px;
        height: 7px;
      }
      ::-webkit-scrollbar-track {
        background: rgba(0, 0, 0, 0.03);
      }
      ::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 9999px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #94a3b8;
      }
      @media print {
        .no-print {
          display: none !important;
        }
        .print-only {
          display: block !important;
        }
        body {
          font-size: 10pt;
          background: white !important;
          color: black !important;
        }
      }
    </style>
  </head>
  <body class="bg-[#f8fafc] text-slate-800 antialiased selection:bg-indigo-500 selection:text-white min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
